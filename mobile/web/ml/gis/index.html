<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NER-LogixAI Operations Console</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        :root {
            --ink:#1c2b33; --muted:#5d6b74; --paper:#eef1ea; --panel:#ffffff;
            --teal:#0d6b68; --teal-dark:#0a5654; --line:#dce2da;
            --low:#2e8b57; --low-bg:#e9f5ee;
            --moderate:#d99a1f; --moderate-bg:#fdf3dd;
            --high:#d56b3f; --high-bg:#fdeee6;
            --critical:#c0392b; --critical-bg:#fbeae7;
            --ok:#2e8b57; --warn:#d99a1f; --bad:#c0392b;
            --shadow:0 10px 32px rgba(20,40,45,.16);
        }
        * { box-sizing:border-box; }
        body { margin:0; color:var(--ink); background:var(--paper); font-family:"Segoe UI",Arial,sans-serif; }
        #map { height:100vh; width:100%; }
        .panel { position:absolute; z-index:1000; top:14px; left:14px; width:min(390px,calc(100vw - 28px)); max-height:calc(100vh - 28px); overflow:auto; padding:18px 18px 22px; background:rgba(255,255,255,.97); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); }
        h1 { margin:0; font-size:22px; letter-spacing:.2px; }
        .subtitle { color:var(--muted); font-size:12.5px; line-height:1.45; margin:6px 0 4px; }
        .status-pill { display:inline-flex; align-items:center; gap:7px; margin-top:10px; padding:6px 12px; border-radius:20px; font-size:12.5px; font-weight:700; background:var(--low-bg); color:var(--low); border:1px solid transparent; }
        .status-pill .dot { width:9px; height:9px; border-radius:50%; background:currentColor; }
        .status-pill.warn { background:var(--warn-bg,#fdf3dd); color:var(--warn); }
        .status-pill.bad { background:var(--critical-bg); color:var(--critical); }
        .status-pill.neutral { background:#eef1f3; color:var(--muted); }
        h2 { margin:20px 0 8px; font-size:14px; color:var(--teal-dark); letter-spacing:.4px; text-transform:uppercase; }
        p { color:var(--muted); line-height:1.4; margin:6px 0 14px; }
        label { display:block; margin:8px 0 5px; color:var(--muted); font-size:11px; font-weight:600; letter-spacing:.6px; text-transform:uppercase; }
        input, select, button { width:100%; min-height:40px; border:1px solid var(--line); padding:9px 11px; font:14px "Segoe UI",Arial,sans-serif; border-radius:8px; }
        input, select { margin-bottom:8px; background:#fff; }
        input:focus, select:focus { outline:2px solid rgba(13,107,104,.25); border-color:var(--teal); }
        button { margin-top:8px; cursor:pointer; color:white; background:var(--teal); border-color:var(--teal); font-weight:700; transition:background .15s; }
        button:hover { background:var(--teal-dark); }
        .result { margin-top:12px; font-size:13px; line-height:1.5; }
        .result[hidden] { display:none; }
        /* Verdict banner */
        .verdict { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:10px; font-weight:700; font-size:15px; color:#fff; }
        .verdict .big { font-size:26px; line-height:1; }
        .verdict small { display:block; font-weight:400; font-size:12px; opacity:.92; margin-top:2px; }
        .verdict.low { background:var(--low); } .verdict.moderate { background:var(--moderate); }
        .verdict.high { background:var(--high); } .verdict.critical { background:var(--critical); }
        /* Risk metric grid */
        .metric { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
        .metric div { padding:9px 10px; background:#fff; border:1px solid var(--line); border-left:4px solid var(--muted); border-radius:8px; }
        .metric div.low { border-left-color:var(--low); }
        .metric div.moderate { border-left-color:var(--moderate); }
        .metric div.high { border-left-color:var(--high); }
        .metric div.critical { border-left-color:var(--critical); }
        .metric strong { display:block; font-size:14.5px; color:var(--ink); }
        .metric .lbl { color:var(--muted); font-size:11px; text-transform:capitalize; }
        .metric .chip { display:inline-block; margin-left:4px; padding:1px 6px; border-radius:10px; font-size:10px; font-weight:700; color:#fff; }
        .metric .chip.low { background:var(--low); } .metric .chip.moderate { background:var(--moderate); }
        .metric .chip.high { background:var(--high); } .metric .chip.critical { background:var(--critical); }
        .small { color:var(--muted); font-size:11px; }
        .muted { color:var(--muted); }
        .kv { display:flex; justify-content:space-between; gap:8px; padding:4px 0; border-bottom:1px dashed #e4e9e2; font-size:12.5px; }
        .kv b { font-weight:600; }
        .note { margin-top:10px; padding:9px 11px; background:#f6f8f4; border:1px solid var(--line); border-radius:8px; font-size:11.5px; color:var(--muted); }
        .note.warn { background:var(--warn-bg,#fdf3dd); border-color:#f0dcae; color:#8a6a12; }
        .alert { border-left:4px solid var(--orange,#d56b3f); padding:7px 9px; margin-top:7px; background:#fff7ed; border-radius:6px; font-size:12px; }
        .sim-tag { display:inline-block; margin-left:4px; padding:1px 6px; border-radius:10px; font-size:10px; font-weight:700; background:#fdf3dd; color:#8a6a12; vertical-align:middle; }
        .sim-tag.live { background:#e9f5ee; color:var(--low); }
        .stat-row { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:10px 0; }
        .stat { background:#f6f8f4; border:1px solid var(--line); border-radius:8px; padding:8px; text-align:center; }
        .stat b { display:block; font-size:16px; }
        .stat span { font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
        .route-legend { display:flex; gap:12px; margin-top:8px; font-size:11px; color:var(--muted); }
        .route-legend i { display:inline-block; width:22px; height:4px; border-radius:2px; margin-right:4px; vertical-align:middle; }
        .errorbox { background:var(--critical-bg); border:1px solid #ecc9c3; color:var(--critical); padding:10px 12px; border-radius:8px; font-size:12.5px; }
        .loading { color:var(--muted); font-size:12.5px; }
        /* Place autocomplete (district HQs + demo villages) */
        .ac { position:relative; margin-bottom:8px; }
        .ac input { margin-bottom:0; }
        .ac-list { position:absolute; top:100%; left:0; right:0; margin-top:2px; z-index:2100; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 12px 30px rgba(20,40,45,.18); padding:4px; max-height:240px; overflow:auto; }
        .ac-item { padding:8px 10px; border-radius:6px; cursor:pointer; }
        .ac-item b { display:block; color:var(--ink); font-size:13.5px; font-weight:600; }
        .ac-item span { display:block; color:var(--muted); font-size:11px; margin-top:1px; }
        .ac-item em { font-style:normal; color:var(--teal); font-weight:600; }
        .ac-item:hover, .ac-item.active { background:#e9f3ef; }
        @media (max-width:600px) { .panel { top:8px; left:8px; width:calc(100vw - 16px); max-height:74vh; } }
    </style>
</head>
<body>
    <aside class="panel">
        <h1>NER-LogixAI</h1>
        <p class="subtitle">Decision support for essential-goods movement, emergency access, and safer travel across the North Eastern Region.</p>
        <span id="systemStatus" class="status-pill neutral"><span class="dot"></span>Checking live sources…</span>

        <h2>Check a location</h2>
        <label for="location">Place, village, or district</label>
        <input id="location" placeholder="Shillong, Meghalaya">
        <button id="locationBtn">Assess location risk</button>
        <div id="locationResult" class="result" hidden></div>

        <h2>Analyze a delivery route</h2>
        <input id="start" placeholder="From: Guwahati">
        <input id="destination" placeholder="To: Shillong">
        <select id="cargoType" aria-label="Cargo type">
            <option value="other">Other cargo</option>
            <option value="medicine">Medicines</option>
            <option value="emergency_supply">Emergency supplies</option>
            <option value="food">Food supplies</option>
            <option value="agricultural_produce">Agricultural produce</option>
            <option value="construction_material">Construction materials</option>
        </select>
        <select id="priority" aria-label="Delivery priority">
            <option value="standard">Standard delivery</option>
            <option value="urgent">Urgent delivery</option>
            <option value="emergency">Emergency response</option>
            <option value="perishable">Perishable cargo</option>
        </select>
        <button id="routeBtn">Analyze route</button>
        <div id="routeResult" class="result" hidden></div>

        <h2>Live operations</h2>
        <div id="status" class="small">Loading source status...</div>
        <div id="alerts"></div>
        <div id="districts" class="small"></div>
    </aside>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map("map").setView([25.5, 93.5], 7);
        const street = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution:"© OpenStreetMap contributors" }).addTo(map);
        const satellite = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { attribution:"© Esri" });
        const layerControl = L.control.layers({ "Street map":street, "Satellite":satellite }).addTo(map);
        // NASA GIBS satellite layers (real acquisition dates from /satellite/layers)
        fetch("/satellite/layers").then(r => r.json()).then(data => {
            (data.layers || []).forEach(layer => {
                const template = (layer.tile_url_template || "").replace("{z}", "{z}").replace("{y}", "{y}").replace("{x}", "{x}");
                if (!template) return;
                const gibs = L.tileLayer(template, {
                    attribution: "© NASA GIBS",
                    maxZoom: 9,
                    maxNativeZoom: 9,
                    opacity: 0.85
                });
                const label = `${layer.name} · ${layer.date}`;
                layerControl.addOverlay(gibs, label);
            });
        }).catch(() => { /* satellite layers unavailable; base layers still work */ });
        let routeLayer, altLayer;
        const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[char]));
        async function getJson(path, options) { const response = await fetch(`${path}`, options); if (!response.ok) throw new Error(`${response.status}: ${await response.text()}`); return response.json(); }

        // ---- Curated place autocomplete (district HQs + demo villages) ----
        function wireAutocomplete(input) {
            const wrap = document.createElement("div");
            wrap.className = "ac";
            input.parentNode.insertBefore(wrap, input);
            wrap.appendChild(input);

            const list = document.createElement("div");
            list.className = "ac-list";
            list.hidden = true;
            wrap.appendChild(list);

            const state = { items: [], active: -1, seq: 0, timer: null };

            function render() {
                list.innerHTML = "";
                state.items.forEach((item, index) => {
                    const row = document.createElement("div");
                    row.className = "ac-item" + (index === state.active ? " active" : "");
                    row.innerHTML = `<b>${escapeHtml(item.label)}</b><span>${escapeHtml(item.district)} district · ${escapeHtml(item.state)}${item.kind === "demo" ? " · <em>demo village</em>" : ""}</span>`;
                    row.addEventListener("mousedown", event => { event.preventDefault(); pick(index); });
                    row.addEventListener("mouseenter", () => setActive(index));
                    list.appendChild(row);
                });
            }
            function setActive(index) {
                state.active = index;
                const rows = list.querySelectorAll(".ac-item");
                rows.forEach((row, i) => row.classList.toggle("active", i === index));
                if (index >= 0 && rows[index]) rows[index].scrollIntoView({ block: "nearest" });
            }
            function hide() { list.hidden = true; list.innerHTML = ""; state.items = []; state.active = -1; }
            function pick(index) {
                const item = state.items[index];
                if (!item) return;
                clearTimeout(state.timer);
                state.seq += 1;
                input.value = item.label;
                hide();
                input.focus();
            }
            async function refresh() {
                const token = ++state.seq;
                const text = input.value.trim();
                if (!text) { hide(); return; }
                try {
                    const data = await getJson(`/places/autocomplete?q=${encodeURIComponent(text)}&limit=8`);
                    if (token !== state.seq) return;
                    state.items = (data.places || []).slice(0, 8);
                    state.active = state.items.length ? 0 : -1;
                    if (state.items.length) { render(); list.hidden = false; } else { hide(); }
                } catch (error) { if (token === state.seq) hide(); }
            }
            input.addEventListener("input", () => {
                clearTimeout(state.timer);
                state.timer = setTimeout(refresh, 140);
            });
            input.addEventListener("blur", () => setTimeout(hide, 160));
            input.addEventListener("keydown", event => {
                if (list.hidden || !state.items.length) return;
                if (event.key === "ArrowDown") { event.preventDefault(); setActive(state.active >= state.items.length - 1 ? 0 : state.active + 1); }
                else if (event.key === "ArrowUp") { event.preventDefault(); setActive(state.active <= 0 ? state.items.length - 1 : state.active - 1); }
                else if (event.key === "Enter") { if (state.active >= 0) { event.preventDefault(); pick(state.active); } }
                else if (event.key === "Escape") { event.preventDefault(); hide(); }
            });
        }
        ["location", "start", "destination"].forEach(id => {
            const input = document.getElementById(id);
            if (input) wireAutocomplete(input);
        });

        // ---- Risk level helpers ----
        const RISK = { "Low": { cls:"low", icon:"✓" }, "Moderate": { cls:"moderate", icon:"⚠" }, "High": { cls:"high", icon:"⚠" }, "Very High": { cls:"critical", icon:"✕" } };
        function riskClass(level) { return (RISK[level] || { cls:"moderate" }).cls; }
        function riskIcon(level) { return (RISK[level] || { cls:"moderate", icon:"⚠" }).icon; }
        function verdictBanner(level, score, subtitle) {
            const info = RISK[level] || { cls:"moderate", icon:"⚠" };
            return `<div class="verdict ${info.cls}"><span class="big">${info.icon}</span><span>${escapeHtml(level)} risk${score != null ? ` · ${escapeHtml(score)} / 100` : ""}<small>${escapeHtml(subtitle || "")}</small></span></div>`;
        }
        function metricCard(name, item) {
            const cls = riskClass(item.risk);
            return `<div class="${cls}"><strong>${escapeHtml(item.risk)} · ${escapeHtml(item.score)}</strong><span class="lbl">${escapeHtml(name.replaceAll("_"," "))}</span> <span class="chip ${cls}">${riskIcon(item.risk)}</span></div>`;
        }

        async function loadMapData() {
            try { const states = await getJson("/geojson"); L.geoJSON(states, { style:{ color:"#0d6b68", weight:1.5, fillOpacity:.04 } }).addTo(map); } catch (error) { console.warn(error); }
            try { const reports = await getJson("/reports.geojson"); L.geoJSON(reports, { pointToLayer:(feature, latlng) => L.circleMarker(latlng, { radius:7, color:"#d56b3f", fillOpacity:.85 }), onEachFeature:(feature, layer) => layer.bindPopup(`<b>${escapeHtml(feature.properties.incident_type)}</b>${feature.properties.simulated ? ' <span class="sim-tag">simulated demo entry</span>' : ' <span class="sim-tag live">live field report</span>'}<br>${escapeHtml(feature.properties.description)}<br>Status: ${escapeHtml(feature.properties.status)}`) }).addTo(map); } catch (error) { console.warn(error); }
            try { const vehicles = await getJson("/vehicles.geojson"); L.geoJSON(vehicles, { pointToLayer:(feature, latlng) => L.circleMarker(latlng, { radius:6, color:"#2356a3", fillColor:"#6ea1e6", fillOpacity:.9 }), onEachFeature:(feature, layer) => layer.bindPopup(`<b>Vehicle ${escapeHtml(feature.properties.vehicle_id)}</b>${feature.properties.simulated ? ' <span class="sim-tag">simulated demo</span>' : ' <span class="sim-tag live">live GPS</span>'}<br>${escapeHtml(feature.properties.cargo_type)}<br>${escapeHtml(feature.properties.status)}<br>${escapeHtml(feature.properties.origin)} → ${escapeHtml(feature.properties.destination)}`) }).addTo(map); } catch (error) { console.warn(error); }
        }
        async function loadOperations() {
            try { const data = await getJson("/data/status"); const sources = Object.values(data.sources).map(source => `${escapeHtml(source.name)}: ${escapeHtml(source.freshness)}`).join(" · "); document.getElementById("status").innerHTML = `Checked ${escapeHtml(data.generated_at)}<br>${sources}`; } catch (error) { document.getElementById("status").textContent = "Source status unavailable"; }
            try { const data = await getJson("/alerts"); document.getElementById("alerts").innerHTML = data.alerts.length ? data.alerts.map(alert => `<div class="alert"><b>${escapeHtml(alert.title)}</b>${alert.simulated ? ' <span class="sim-tag">simulated demo entry</span>' : ' <span class="sim-tag live">live field report</span>'}<br>${escapeHtml(alert.message)}<br><span class="small">${escapeHtml(alert.severity)} · ${escapeHtml(alert.status)}</span></div>`).join("") : "<div class='small'>No active alerts.</div>"; const severityAlerts = data.alerts.filter(a => ["high","critical"].includes(String(a.severity).toLowerCase())); const realHigh = severityAlerts.filter(a => !a.simulated); const pill = document.getElementById("systemStatus"); if (realHigh.length) { pill.className = "status-pill bad"; pill.innerHTML = '<span class="dot"></span>Active high-severity alert'; } else if (severityAlerts.length) { pill.className = "status-pill warn"; pill.innerHTML = '<span class="dot"></span>Simulated demo alerts · live report via /field'; } else { pill.className = "status-pill low"; pill.innerHTML = '<span class="dot"></span>Systems nominal'; } } catch (error) { document.getElementById("alerts").textContent = "Alerts unavailable"; }
            try { const data = await getJson("/districts/accessibility"); const attention = data.states.filter(state => state.risk_level === "High" || state.risk_level === "Very High").slice(0, 4); document.getElementById("districts").innerHTML = `<h2>District watch</h2>${attention.length ? attention.map(state => `<div class="kv"><b>${escapeHtml(state.state)}</b><span>${escapeHtml(state.risk_level)} · accessibility ${escapeHtml(state.accessibility_score)}</span></div>`).join("") : "<div class='muted'>No high-risk district evidence currently matched.</div>"}<p class="small">${escapeHtml(data.warning)}</p>`; } catch (error) { document.getElementById("districts").textContent = "District status unavailable"; }
        }

        document.getElementById("locationBtn").onclick = async () => {
            const location = document.getElementById("location").value.trim();
            const output = document.getElementById("locationResult");
            if (!location) { output.hidden = false; output.innerHTML = `<div class="errorbox">Please enter a place name first.</div>`; return; }
            output.hidden = false; output.innerHTML = `<div class="loading">Assessing weather, terrain, river level, and nearby evidence…</div>`;
            try {
                const data = await getJson("/location/analyze", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ location }) });
                map.setView([data.place.lat, data.place.lon], 11);
                L.marker([data.place.lat, data.place.lon]).addTo(map).bindPopup(escapeHtml(data.place.name)).openPopup();
                const metrics = Object.entries(data.risks).map(([name,item]) => metricCard(name, item)).join("");
                // At-a-glance problem list: every risk above Low
                const concerns = Object.entries(data.risks).filter(([,item]) => item.risk !== "Low");
                const concernLine = concerns.length
                    ? `<div class="note warn">⚠ ${concerns.map(([name,item]) => `${escapeHtml(name.replaceAll("_"," "))}: ${escapeHtml(item.risk)} (${escapeHtml(item.score)})`).join(" · ")}</div>`
                    : `<div class="note">✓ No elevated risks at this location right now.</div>`;
                const terrain = data.terrain?.local_relief_m == null ? "Terrain relief unavailable" : `Local relief: ${escapeHtml(data.terrain.local_relief_m)} m`;
                const live = data.live_estimates || {};
                const liveLine = live.rainfall_24h_mm == null ? "Live rainfall: unavailable" : `Live rainfall: ${escapeHtml(live.rainfall_24h_mm)} mm / 24 h`;
                const river = live.river_flood;
                const riverLine = river && river.discharge_m3s != null ? `River discharge: ${escapeHtml(river.discharge_m3s)} m³/s (river p90 ${escapeHtml(river.p90_m3s)} m³/s) · ${escapeHtml(river.source || "GloFAS")}` : "";
                output.innerHTML =
                    `<div class="kv"><b>${escapeHtml(data.place.name)}</b></div>` +
                    verdictBanner(data.overall_risk, data.overall_score, "Combined risk from weather, terrain, river level, and recorded hazards") +
                    `<div class="metric">${metrics}</div>` +
                    concernLine +
                    `<div class="note">${terrain}<br>${liveLine}${riverLine ? `<br>${riverLine}` : ""}<br>Confidence: ${Math.round(data.confidence * 100)}% · Evidence matched: ${data.nearby_evidence_count}</div>` +
                    (data.warnings && data.warnings.length ? `<p class="small muted">${data.warnings.map(escapeHtml).join("<br>")}</p>` : "");
            } catch (error) { output.innerHTML = `<div class="errorbox"><b>Unable to assess</b><br>${escapeHtml(error.message)}</div>`; }
        };

        document.getElementById("routeBtn").onclick = async () => {
            const output = document.getElementById("routeResult");
            const start = document.getElementById("start").value.trim();
            const destination = document.getElementById("destination").value.trim();
            if (!start || !destination) { output.hidden = false; output.innerHTML = `<div class="errorbox">Enter both a starting place and a destination.</div>`; return; }
            output.hidden = false; output.innerHTML = `<div class="loading">Analyzing route segments…</div>`;
            try {
                const data = await getJson("/route/analyze", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ start, destination, cargo_type:document.getElementById("cargoType").value, priority:document.getElementById("priority").value }) });
                if (routeLayer) map.removeLayer(routeLayer);
                if (altLayer) map.removeLayer(altLayer);
                routeLayer = L.geoJSON(data.route.geometry, { style:{ color:"#d56b3f", weight:5 } }).addTo(map);
                altLayer = L.layerGroup();
                (data.alternative_routes || []).forEach(alt => {
                    if (alt.geometry) L.geoJSON(alt.geometry, { style:{ color:"#4a8fb5", weight:4, dashArray:"7 7", opacity:.85 } }).addTo(altLayer);
                });
                if (altLayer.getLayers().length) altLayer.addTo(map);
                map.fitBounds(routeLayer.getBounds());
                const segment = data.route.segment_risk?.highest_risk;
                const evidence = data.route.segment_risk?.evidence_summary;
                const decision = data.safety_decision || {};
                const statusMap = { avoid_verified_incident:{ cls:"critical", icon:"✕", title:"Do not take this route" }, high_caution:{ cls:"high", icon:"⚠", title:"Use high caution" }, no_verified_closure:{ cls:"moderate", icon:"⚠", title:"No verified closure found" } };
                const st = statusMap[decision.status] || { cls:"moderate", icon:"⚠", title:"Route assessed" };
                const evidenceText = evidence ? `${escapeHtml(evidence.historical_hazard_count)} historical · ${escapeHtml(evidence.current_incident_count)} current · ${escapeHtml(evidence.verified_current_incident_count)} verified` : "Evidence summary unavailable";
                const recommendation = data.route_recommendation?.reason || "Best available route selected.";
                const chosenRisk = data.route.route_risk_score;
                const alts = data.alternative_routes || [];
                const alternativesHtml = alts.length
                    ? `<div class="note" style="margin-top:8px"><b>All corridors (${escapeHtml(alts.length + 1)}):</b><br><span style="color:#d56b3f">━</span> recommended · <span style="color:#4a8fb5">╌╌</span> alternative` +
                      alts.map(alt => {
                          const altRisk = alt.route_risk_score;
                          const riskLevel = alt.segment_risk?.highest_risk?.risk_level || "";
                          const safer = altRisk != null && chosenRisk != null && altRisk < chosenRisk;
                          const faster = (alt.duration || 0) < (data.route.duration || 0);
                          const tag = safer ? " · <b style='color:#2e8b57'>safer corridor</b>" : (faster ? " · <b style='color:#4a8fb5'>faster alternative</b>" : "");
                          return `<br>Route #${escapeHtml(alt.route_number)} — ${escapeHtml(alt.duration_text)}, ${escapeHtml(alt.distance_text)} — worst ${escapeHtml(riskLevel)} (${escapeHtml(altRisk)})${tag}`;
                      }).join("") + `</div>`
                    : "";
                output.innerHTML =
                    `<div class="kv"><b>${escapeHtml(data.start.name)} → ${escapeHtml(data.destination.name)}</b></div>` +
                    `<div class="verdict ${st.cls}"><span class="big">${st.icon}</span><span>${escapeHtml(st.title)}<small>${escapeHtml(decision.message || "Review the evidence before departure.")}</small></span></div>` +
                    `<div class="stat-row"><div class="stat"><b>${escapeHtml(data.route.distance_text)}</b><span>Distance</span></div><div class="stat"><b>${escapeHtml(data.route.duration_text)}</b><span>Travel time</span></div><div class="stat"><b>${escapeHtml(decision.danger_segment_count || 0)}</b><span>Danger seg.</span></div></div>` +
                    `<div class="kv"><b>Recommended route</b><span>${escapeHtml(data.route_recommendation.priority)} ${escapeHtml(data.route_recommendation.cargo_type)}</span></div>` +
                    `<div class="kv"><b>Route trade-off</b><span>${escapeHtml(data.route_recommendation.optimization_basis || "")}</span></div>` +
                    `<p class="small muted">${escapeHtml(recommendation)}</p>` +
                    `<div class="note"><b>Weather safety:</b> ${escapeHtml(data.safety_score)} / 100 · <b>Risk:</b> ${escapeHtml(data.risk_level)}<br><b>Segments checked:</b> ${escapeHtml(decision.checked_route_segments || 0)} · <b>Evidence:</b> ${evidenceText}</div>` +
                    (segment ? `<div class="note warn"><b>Highest-risk segment:</b> ${escapeHtml(segment.risk_level)} (${escapeHtml(segment.risk_score)})<br><span class="small">${segment.evidence.map(escapeHtml).join(" · ")}</span></div>` : "") +
                    (alternativesHtml || "") +
                    (evidence && evidence.current_closure_confirmed ? `<div class="note warn">⚠ ${escapeHtml(decision.message || "Verified current incident found; avoid until cleared.")}</div>` : "");
            } catch (error) { output.innerHTML = `<div class="errorbox"><b>Route unavailable</b><br>${escapeHtml(error.message)}</div>`; }
        };

        loadMapData(); loadOperations(); setInterval(loadOperations, 30000);
    </script>

  HOW IT WORKS:
  This does NOT require knowing your app's internal JS functions. It scans
  all visible text on the page, and swaps known English phrases for Hindi
  or Assamese translations when you click the toggle. It automatically
  re-scans whenever new content appears (like a risk result loading in),
  using a MutationObserver.

  LIMITATION (be upfront about this if asked): this translates fixed UI
  labels and known result phrases only - not place names, raw numbers, or
  any text not in the dictionary below. That's a deliberate scope choice
  for speed; expanding the dictionary just means adding more entries below.

<style>
  #lang-toggle-bar {
    position: fixed;
    bottom: 20px;
    right: 10px;
    z-index: 9999;
    background: white;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 4px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    font-family: sans-serif;
    font-size: 13px;
  }
  #lang-toggle-bar button {
    border: none;
    background: transparent;
    padding: 5px 10px;
    cursor: pointer;
    border-radius: 4px;
    font-size: 13px;
  }
  #lang-toggle-bar button.active {
    background: #16697A;
    color: white;
  }
</style>

<div id="lang-toggle-bar">
  <button data-lang="en" class="active">EN</button>
  <button data-lang="hi">हिं</button>
  <button data-lang="as">অস</button>
</div>

<script>
(function () {
  // Longest phrases first, so "Very High" is replaced before "High" alone
  var DICTIONARY = [
    { en: "No verified closure was found; this is not a guarantee of safe travel.",
      hi: "कोई सत्यापित मार्ग बंद होने की पुष्टि नहीं हुई; यह सुरक्षित यात्रा की गारंटी नहीं है।",
      as: "কোনো সত্যাপিত বন্ধ হোৱাৰ প্ৰমাণ পোৱা নাযায়; এইটো নিৰাপদ যাত্ৰাৰ নিশ্চয়তা নহয়।" },
    { en: "No nearby historical landslide record was found",
      hi: "आस-पास कोई ऐतिहासिक भूस्खलन रिकॉर्ड नहीं मिला",
      as: "ওচৰত কোনো ঐতিহাসিক ভূমিস্খলনৰ তথ্য পোৱা নাযায়" },
    { en: "Boulder risk is a terrain susceptibility estimate, not live object detection",
      hi: "चट्टान गिरने का जोखिम भूभाग-आधारित अनुमान है, वास्तविक वस्तु पहचान नहीं",
      as: "শিল খহনৰ বিপদ ভূ-খণ্ডৰ আধাৰত অনুমান, প্ৰকৃত বস্তু চিনাক্তকৰণ নহয়" },
    { en: "Analyze a delivery route", hi: "डिलीवरी मार्ग का विश्लेषण करें", as: "ডেলিভাৰী পথ বিশ্লেষণ কৰক" },
    { en: "Assess location risk", hi: "स्थान जोखिम का आकलन करें", as: "স্থানৰ বিপদ মূল্যায়ন কৰক" },
    { en: "Check a location", hi: "स्थान जांचें", as: "স্থান পৰীক্ষা কৰক" },
    { en: "boulder or rockfall", hi: "पत्थर या चट्टान गिरना", as: "শিল বা শিলা-খহনীয়া" },
    { en: "current incident", hi: "वर्तमान घटना", as: "বৰ্তমান ঘটনা" },
    { en: "Recommended route", hi: "अनुशंसित मार्ग", as: "চুপাৰিছ কৰা পথ" },
    { en: "Analyze route", hi: "मार्ग का विश्लेषण करें", as: "পথ বিশ্লেষণ কৰক" },
    { en: "Very High", hi: "अत्यधिक उच्च", as: "অতি উচ্চ" },
    { en: "landslide", hi: "भूस्खलन", as: "ভূমিস্খলন" },
    { en: "Moderate", hi: "मध्यम", as: "মধ্যম" },
    { en: "flood", hi: "बाढ़", as: "বান পানী" },
    { en: "High", hi: "उच्च", as: "উচ্চ" },
    { en: "Low", hi: "कम", as: "কম" }
  ];

  var currentLang = "en";
  var originalTextMap = new WeakMap(); // node -> original English text

  function walkTextNodes(root, callback) {
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    var node;
    while ((node = walker.nextNode())) {
      if (node.parentElement && node.parentElement.closest("#lang-toggle-bar")) continue;
      callback(node);
    }
  }

  function applyLanguage(lang) {
    currentLang = lang;
    walkTextNodes(document.body, function (node) {
      if (!originalTextMap.has(node)) {
        originalTextMap.set(node, node.nodeValue);
      }
      var original = originalTextMap.get(node);
      if (lang === "en") {
        node.nodeValue = original;
        return;
      }
      var replaced = original;
      DICTIONARY.forEach(function (entry) {
        var translation = entry[lang];
        if (!translation) return;
        // Global, case-sensitive replace of the English phrase
        replaced = replaced.split(entry.en).join(translation);
      });
      node.nodeValue = replaced;
    });
  }

  // Re-apply current language whenever new content is added to the page
  // (e.g. a risk result loading in after clicking "Assess location risk")
  var observer = new MutationObserver(function () {
    if (currentLang !== "en") applyLanguage(currentLang);
  });
  observer.observe(document.body, { childList: true, subtree: true });

  document.querySelectorAll("#lang-toggle-bar button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll("#lang-toggle-bar button").forEach(function (b) {
        b.classList.remove("active");
      });
      btn.classList.add("active");
      applyLanguage(btn.getAttribute("data-lang"));
    });
  });
})();
</script>
